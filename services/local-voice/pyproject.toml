[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crewcode-local-voice"
version = "0.1.0"
description = "Loopback-only Parakeet and Kokoro voice sidecar for CrewCode"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "kokoro>=0.9.4,<1",
  "misaki[en]>=0.9.4,<1",
  "nemo_toolkit[asr]>=2.2,<3",
]

[project.scripts]
crewcode-local-voice = "crewcode_voice.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crewcode_voice*"]
